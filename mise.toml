[tools]
node = "24.19.0"
pnpm = "11.20.0"
rust = "latest"
cmake = "4.4.4"

[tasks.setup]
description = "初回セットアップをまとめて実行する"
depends = ["setup:submodule", "setup:model", "setup:deps", "setup:dev-vars"]

[tasks."setup:submodule"]
description = "whisper.cppのsubmoduleを取得する"
run = "git submodule update --init --recursive"

[tasks."setup:model"]
description = "Kotoba-Whisperモデルをダウンロードし、SHA-256を確認する"
depends = ["setup:submodule"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
model=app/whisper.cpp/models/ggml-kotoba-whisper-v2.0-q5_0.bin
url=https://huggingface.co/kotoba-tech/kotoba-whisper-v2.0-ggml/resolve/main/ggml-kotoba-whisper-v2.0-q5_0.bin
expected=4a3b92192b5d3578ff854a5876213e2e27af0c2d357492c2d14271e82c303658

if [ ! -f "$model" ]; then
  curl -fL "$url" -o "$model.part"
  mv "$model.part" "$model"
fi

if command -v sha256sum >/dev/null; then
  actual=$(sha256sum "$model" | cut -d' ' -f1)
else
  actual=$(shasum -a 256 "$model" | cut -d' ' -f1)
fi

if [ "$actual" != "$expected" ]; then
  echo "モデルのSHA-256が一致しません: $actual" >&2
  echo "削除して再実行してください: rm $model" >&2
  exit 1
fi
echo "モデルのSHA-256を確認しました"
'''

[tasks."setup:deps"]
description = "依存関係をインストールする"
run = "pnpm install --frozen-lockfile"
# node_modulesの作り直しなど、pnpmの確認プロンプトに答えられるようにする
raw = true

[tasks."setup:dev-vars"]
description = "Workerの.dev.varsがなければ.dev.vars.exampleからコピーする"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for dir in upload_api ai_api; do
  if [ ! -f "$dir/.dev.vars" ]; then
    cp "$dir/.dev.vars.example" "$dir/.dev.vars"
    echo "$dir/.dev.vars を作成しました。値を設定してください"
  fi
done
'''

[tasks."build:app"]
description = "キーチェーンの証明書で署名してアプリをビルドする（追加の引数はtauri buildに渡す）"
dir = "app"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# APPLE_SIGNING_IDENTITYが未指定なら、Developer ID → Apple Developmentの順でキーチェーンから選ぶ
if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
  identities=$(security find-identity -v -p codesigning)
  for kind in "Developer ID Application" "Apple Development"; do
    APPLE_SIGNING_IDENTITY=$(printf '%s\n' "$identities" | sed -n "s/.*\"\($kind: .*\)\"/\1/p" | head -n1)
    [ -n "$APPLE_SIGNING_IDENTITY" ] && break
  done
fi
if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
  echo "署名に使える証明書がキーチェーンにありません" >&2
  exit 1
fi
export APPLE_SIGNING_IDENTITY
echo "署名に使う証明書: $APPLE_SIGNING_IDENTITY"
pnpm tauri build "$@"
'''
