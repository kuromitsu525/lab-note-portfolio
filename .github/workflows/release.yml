name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Node.js・pnpm・Rust・CMakeを mise.toml のバージョンで入れる
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      - name: Kotoba-Whisperモデルをキャッシュ
        uses: actions/cache@v4
        with:
          path: app/whisper.cpp/models/ggml-kotoba-whisper-v2.0-q5_0.bin
          key: kotoba-whisper-v2.0-q5_0-4a3b92192b5d3578

      - name: モデルを取得してSHA-256を確認
        run: mise run setup:model

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      # tauri.conf.jsonのメジャー・マイナーを基準に、最新リリースからパッチを1つ上げる
      # 例: 基準0.1・最新v0.1.4 → 0.1.5 / 基準0.2・最新v0.1.4 → 0.2.0
      - name: バージョンを決める
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(node -p "require('./app/src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          latest=${latest#v}
          if [ "${latest%.*}" = "$base" ]; then
            version="$base.$(( ${latest##*.} + 1 ))"
          else
            version="$base.0"
          fi
          echo "version: $version (latest: ${latest:-なし})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # tauri.conf.json・package.json・Cargo.toml・Cargo.lockを書き換えてmainにpushする
      # GITHUB_TOKENによるpushではワークフローが再実行されないため、ループしない
      - name: バージョンをリポジトリに反映
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            for (const file of ["app/src-tauri/tauri.conf.json", "app/package.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = process.env.VERSION;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
          '
          perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' app/src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "lab-note"\nversion = )".*?"/$1"$ENV{VERSION}"/' app/src-tauri/Cargo.lock

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src-tauri/tauri.conf.json app/package.json app/src-tauri/Cargo.toml app/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: v$VERSION をリリース"
            # ビルド開始後にmainが進んでいた場合に備えてrebaseしてからpushする
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          # バージョンを書き換えたコミットにタグを付ける
          releaseCommitish: ${{ steps.bump.outputs.sha }}
          tagName: v__VERSION__
          releaseName: Lab Note v__VERSION__
          releaseBody: '`.dmg` をダウンロードしてインストールしてください。'
          releaseDraft: false
          prerelease: false
          # モデルを含み大きいため、.app.tar.gzは作らずdmgのみにする
          args: --bundles dmg
