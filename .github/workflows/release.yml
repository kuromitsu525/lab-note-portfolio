name: Release

on:
  push:
    branches: [main]
    paths:
      - app/src-tauri/tauri.conf.json
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # tauri.conf.jsonのバージョンのリリースがまだなければリリースする
  # (バージョン以外の変更でtauri.conf.jsonが更新された場合はスキップする)
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: バージョンを確認
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version はリリース済みのためスキップします"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version をリリースします"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    permissions:
      contents: write
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Node.js・pnpm・Rust・CMakeを mise.toml のバージョンで入れる
      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      - name: Kotoba-Whisperモデルをキャッシュ
        uses: actions/cache@v6
        with:
          path: app/whisper.cpp/models/ggml-kotoba-whisper-v2.0-q5_0.bin
          key: kotoba-whisper-v2.0-q5_0-4a3b92192b5d3578

      - name: モデルを取得してSHA-256を確認
        run: mise run setup:model

      # whisper.cppのCMakeビルドをccacheでキャッシュする
      # checkoutでソースのmtimeが更新されるため、ビルドディレクトリではなくコンパイル結果をキャッシュする
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: whisper-cpp-${{ runner.os }}-${{ runner.arch }}
          max-size: 500M

      - name: pnpm storeのパスを取得
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm storeをキャッシュ
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      # 公証に使うApp Store Connect APIキー(.p8)をファイルに書き出す
      - name: 公証用APIキーを用意
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID証明書で署名する
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # App Store Connect APIキーで公証する
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          # beforeBuildCommandのcmakeにccacheを使わせる
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        with:
          projectPath: app
          tauriScript: pnpm tauri
          releaseCommitish: ${{ github.sha }}
          tagName: v__VERSION__
          releaseName: Lab Note v__VERSION__
          releaseBody: |
            ## インストール（macOS Apple Silicon）

            1. 下の Assets から `.dmg` をダウンロードして開き、`lab-note.app` を「アプリケーション」にドラッグします。
            2. `lab-note.app` を開きます。
          releaseDraft: false
          prerelease: false
          # モデルを含み大きいため、.app.tar.gzは作らずdmgのみにする
          args: --bundles dmg
