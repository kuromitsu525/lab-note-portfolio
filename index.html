<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Note</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main aria-label="Lab Note">
        <div id="generateTab">
            <div class="workspace-grid">
                <div class="workspace-main">
                    <section class="panel meeting-area">
                        <div class="section-heading">
                            <span class="step-number">1</span>
                            <div><h2>報告会・報告者</h2></div>
                        </div>
                        <label for="meetingGroup">報告会</label>
                        <div class="select-wrap">
                            <select id="meetingGroup">
                                <option value="">選択してください</option>
                                <option value="3年セミナー">3年セミナー</option>
                                <option value="HCI班">HCI班</option>
                                <option value="HAR班">HAR班</option>
                                <option value="LBS班">LBS班</option>
                            </select>
                        </div>
                        <label for="presentationEsaUrl">個人発表用esa URL（任意）</label>
                        <input type="url" id="presentationEsaUrl" placeholder="空欄なら話者名と録音日から自動検索">
                        <label class="member-label">報告者</label>
                        <div id="memberButtons" class="member-buttons"></div>
                    </section>

                    <section class="panel record-area">
                        <div class="section-heading">
                            <span class="step-number">2</span>
                            <div><h2>録音・文字起こし</h2></div>
                        </div>
                        <div class="recording-date-field">
                            <label for="recordingDate">録音日</label>
                            <input type="date" id="recordingDate">
                        </div>
                        <div class="recorder-console">
                            <div class="timer-block"><span class="timer-label">録音時間</span><span id="timer">00:00</span></div>
                            <div class="record-actions">
                                <button type="button" id="startButton"><span class="record-icon" aria-hidden="true"></span>録音開始</button>
                                <button type="button" id="stopButton" disabled><span class="stop-icon" aria-hidden="true"></span>録音停止</button>
                                <button type="button" id="uploadButton" disabled>保存してAI要約</button>
                            </div>
                        </div>
                        <div id="audioArea"></div>
                        <div class="transcript-heading"><h3 id="transcriptLabel">文字起こし結果</h3><span id="transcriptHint">録音停止後に編集できます</span></div>
                        <textarea id="transcript" aria-labelledby="transcriptLabel" aria-describedby="transcriptHint" placeholder="ここに文字起こし結果が表示されます" readonly></textarea>
                    </section>
                </div>

                <aside class="workspace-side">
                    <button type="button" id="clearDraftButton" class="danger-button">記録をリセット</button>
                    <section class="panel report-list-area">
                        <div class="section-heading compact">
                            <span class="step-number">3</span>
                            <div><h2>報告状況</h2></div>
                        </div>
                        <div id="reportList" class="report-list-empty">報告会を選択してください</div>
                    </section>
                </aside>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
