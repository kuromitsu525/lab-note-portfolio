<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Note</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main aria-label="Lab Note">
        <div id="generateTab">
            <div class="workspace-grid">
                <div class="workspace-main">
                    <section class="panel meeting-area">
                        <div class="section-heading">
                            <span class="step-number">1</span>
                            <div><h2>報告会・報告者</h2></div>
                        </div>
                        <label for="meetingGroup">報告会</label>
                        <div class="select-wrap">
                            <select id="meetingGroup">
                                <option value="">選択してください</option>
                                <option value="3年セミナー">3年セミナー</option>
                                <option value="HCI班">HCI班</option>
                                <option value="HAR班">HAR班</option>
                                <option value="LBS班">LBS班</option>
                            </select>
                        </div>
                        <div class="presentation-esa-field">
                            <label for="presentationEsaUrl">個人発表用esa URL（任意）</label>
                            <input type="url" id="presentationEsaUrl" placeholder="https://kjlb.esa.io/posts/..." aria-describedby="presentationEsaHint">
                            <p id="presentationEsaHint">空欄なら自動検索</p>
                        </div>
                        <label class="member-label">報告者</label>
                        <div id="memberButtons" class="member-buttons"></div>
                    </section>

                    <section class="panel record-area">
                        <div class="section-heading">
                            <span class="step-number">2</span>
                            <div><h2>録音・文字起こし</h2></div>
                        </div>
                        <div class="recording-date-field">
                            <label for="recordingDate">録音日</label>
                            <input type="date" id="recordingDate">
                        </div>
                        <div class="recorder-console">
                            <div class="timer-block"><span class="timer-label">録音時間</span><span id="timer">00:00</span></div>
                            <div class="record-actions">
                                <button type="button" id="startButton"><span class="record-icon" aria-hidden="true"></span>録音開始</button>
                                <button type="button" id="stopButton" disabled><span class="stop-icon" aria-hidden="true"></span>録音停止</button>
                                <button type="button" id="uploadButton" disabled>保存してAI要約</button>
                            </div>
                        </div>
                        <div id="audioArea"></div>
                        <div class="transcript-heading"><h3 id="transcriptLabel">文字起こし結果</h3><span id="transcriptHint">録音停止後に編集できます</span></div>
                        <textarea id="transcript" aria-labelledby="transcriptLabel" aria-describedby="transcriptHint" placeholder="ここに文字起こし結果が表示されます" readonly></textarea>
                    </section>
                </div>

                <aside class="workspace-side">
                    <div class="workspace-side-actions">
                        <button type="button" id="clearDraftButton" class="danger-button">記録をリセット</button>
                        <button type="button" id="settingsButton" class="settings-button" aria-label="Cloudflare Access設定を開く" title="設定">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 8.7a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Zm9 3.3-.1-1.2-2.2-.8a7.3 7.3 0 0 0-.7-1.6l1-2.1a9.4 9.4 0 0 0-1.7-1.7l-2.1 1a7.3 7.3 0 0 0-1.6-.7L12.8 2h-2.4l-.8 2.2a7.3 7.3 0 0 0-1.6.7l-2.1-1a9.4 9.4 0 0 0-1.7 1.7l1 2.1a7.3 7.3 0 0 0-.7 1.6l-2.2.8a9.8 9.8 0 0 0 0 2.4l2.2.8a7.3 7.3 0 0 0 .7 1.6l-1 2.1a9.4 9.4 0 0 0 1.7 1.7l2.1-1a7.3 7.3 0 0 0 1.6.7l.8 2.2h2.4l.8-2.2a7.3 7.3 0 0 0 1.6-.7l2.1 1a9.4 9.4 0 0 0 1.7-1.7l-1-2.1a7.3 7.3 0 0 0 .7-1.6l2.2-.8.1-1.2Z"/>
                            </svg>
                            <span id="settingsState" class="settings-state" aria-hidden="true"></span>
                        </button>
                    </div>
                    <section class="panel report-list-area">
                        <div class="section-heading compact">
                            <span class="step-number">3</span>
                            <div><h2>報告状況</h2></div>
                        </div>
                        <div id="reportList" class="report-list-empty">報告会を選択してください</div>
                    </section>
                </aside>
            </div>
        </div>
    </main>

    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
        <form id="settingsForm">
            <div class="settings-dialog-heading">
                <div>
                    <h2 id="settingsTitle">Cloudflare Access設定</h2>
                    <p>Lab Note専用のService Tokenを設定します。</p>
                </div>
                <button type="button" id="closeSettingsButton" class="settings-close-button" aria-label="設定を閉じる">×</button>
            </div>

            <label for="cloudflareAccessClientId">Client ID</label>
            <input type="text" id="cloudflareAccessClientId" autocomplete="off" autocapitalize="off" spellcheck="false">

            <label for="cloudflareAccessClientSecret">Client Secret</label>
            <input type="password" id="cloudflareAccessClientSecret" autocomplete="off" autocapitalize="off" spellcheck="false">

            <p class="settings-security-note">設定はこの端末の安全な資格情報ストアに保存されます。ソースコードやGitには保存されません。</p>
            <p id="settingsMessage" class="settings-message" role="status" aria-live="polite"></p>

            <div class="settings-dialog-actions">
                <button type="button" id="deleteSettingsButton" class="settings-delete-button">設定を削除</button>
                <button type="button" id="testSettingsButton" class="settings-secondary-button">接続確認</button>
                <button type="submit" id="saveSettingsButton" class="settings-primary-button">保存</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
